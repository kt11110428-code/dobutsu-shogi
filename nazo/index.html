<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#23392d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="盤あそび">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-192.png">
<style>
#app{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a.brand{color:inherit;text-decoration:none;display:flex;align-items:center;gap:8px}
a.brand .hm{font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
</style>
<title>なぞなぞ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  color-scheme: dark;
  --forest:#23392d; --forest2:#2f4a3a; --cream:#fff6e3; --muted:#b9c9b6;
  --hi:#ffe36e; --ink:#4a3521; --sub:#7a5a3a; --go:#3f9a5b; --no:#c0573a; --paper2:#f3e6c8;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{touch-action:manipulation}
body{margin:0;background:var(--forest);color:var(--cream);font-family:var(--font);-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;padding-inline:16px}

/* toolbar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;border-bottom:1px solid rgba(255,255,255,.08);flex:none}
.brand{font-weight:900;font-size:15px;letter-spacing:.04em;margin-right:auto;white-space:nowrap}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:12px;padding:3px;gap:3px;min-width:0}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px;padding:7px 11px;border-radius:9px;line-height:1.15;text-align:center;flex:1 1 auto;min-width:0}
.seg button small{display:block;font-size:11px;font-weight:500;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--cream);color:var(--ink)}
.seg .short{display:none}
.tools{display:flex;gap:6px}
.tools button{border:1px solid rgba(255,255,255,.18);background:var(--forest2);color:var(--cream);font-weight:700;font-size:14px;padding:9px 12px;border-radius:10px}

/* question card */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:12px;overflow:auto}
.card{width:min(820px,100%);background:var(--cream);color:var(--ink);border-radius:24px;padding:20px 24px 22px;box-shadow:0 12px 34px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:14px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--sub)}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.score{display:flex;gap:10px;font-variant-numeric:tabular-nums}
.score span{display:inline-flex;align-items:center;gap:4px}
.q{font-size:clamp(22px,4.2vw,40px);font-weight:900;line-height:1.5;text-wrap:pretty;margin:0;min-height:3em;display:flex;align-items:center}
.q .lead{color:var(--sub);font-size:.6em;display:block}
.box{border-radius:16px;padding:12px 16px;font-weight:700;font-size:clamp(16px,2.4vw,20px);line-height:1.6}
.hint{background:#fdf0c4;border:2px dashed #e0b84a}
.hint b{color:#9a6a00}
.ans{background:#e4f2e3;border:2px solid var(--go)}
.ans .a{font-size:clamp(26px,5vw,44px);font-weight:900;line-height:1.3;color:#1f5e33;display:block}
.ans .e{display:block;margin-top:6px;color:var(--ink);font-size:clamp(15px,2.2vw,18px)}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.acts button{border:0;border-radius:14px;padding:13px 20px;font-weight:900;font-size:clamp(15px,2.4vw,19px);background:var(--forest2);color:var(--cream);display:inline-flex;align-items:center;gap:8px}
.acts button.go{background:var(--go)}
.acts button.no{background:var(--no)}
.acts button.soft{background:var(--paper2);color:var(--ink)}
.acts button:disabled{opacity:.35}
.done{text-align:center}
.done .big{font-size:64px;line-height:1}
.done h2{margin:6px 0;font-size:30px;font-weight:900}
.done p{margin:0;font-size:18px;font-weight:700;color:var(--sub)}
.prog{width:min(820px,100%);height:8px;border-radius:99px;background:rgba(255,255,255,.12);margin-top:12px;overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:var(--hi);border-radius:99px;transition:width .3s}

/* settings */
.modal{position:fixed;inset:0;background:rgba(10,20,14,.7);z-index:50;display:grid;place-items:center;padding:16px}
.sheet{background:var(--cream);color:var(--ink);border-radius:18px;width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px 22px}
.sheet h3{margin:18px 0 8px;font-size:17px;font-weight:900}
.sheet .head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet .head h2{margin:0;font-size:20px;font-weight:900}
.sheet .close{border:0;background:var(--forest2);color:var(--cream);font-weight:900;border-radius:10px;padding:10px 16px;font-size:15px}
.sheet label.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--paper2);margin-bottom:6px;font-weight:700;font-size:15px;line-height:1.45}
.sheet label.opt small{display:block;font-weight:500;color:var(--sub);font-size:13px}
.sheet input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--go)}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .row label.opt{flex:1;min-width:120px;align-items:center}
.sheet .reset{border:0;border-radius:10px;padding:10px 14px;font-weight:900;background:var(--no);color:#fff;font-size:14px}
.note{font-size:13px;line-height:1.65;color:var(--sub);margin:0 0 8px}

@media (max-width:700px){
  .bar{gap:6px;padding-block:6px}
  .brand{font-size:13px}
  a.brand .bn{display:none}
  .seg{flex:1 1 100%;order:3}
  .seg button{padding:7px 4px;font-size:12.5px;white-space:nowrap}
  .seg button small,.seg .long{display:none}
  .seg .short{display:inline}
  .tools button{padding:7px 9px;font-size:12.5px}
  .card{padding:16px 16px 18px;border-radius:20px;gap:12px}
  .acts{gap:8px}
  .acts button{padding:11px 14px}
}
@media (max-height:560px){
  .q{min-height:0}
  .card{gap:8px;padding-block:12px}
}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>
<body>


<div id="app">
  <div class="bar">
    <a class="brand" href="../"><span class="hm">◀ ホーム</span><span class="bn">なぞなぞ</span></a>

    <div class="tools">
      <button id="gear" type="button">せってい</button>

    <div class="card" id="card"></div>
    <div class="prog"><i id="prog"></i></div>

</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

    {q:'3人が1万円ずつ出して3万円の部屋に泊まった。店主は「本当は2万5千円」と言って、ボーイに5千円を返させた。ボーイは2千円をこっそり取り、3人に千円ずつ返した。3人は9千円ずつで計2万7千円、ボーイの2千円と合わせて2万9千円。あとの千円はどこ？',h:'2万7千円の中に、ボーイの2千円はもう入っている。',a:'どこにも消えていない（足し算のしかたが間違い）',e:'正しくは 2万7千円＝宿代2万5千円＋ボーイの2千円。返した3千円と合わせて3万円。'},

  {q:'ペンギンのひざは、どこにある？',h:'外からはほとんど見えない。',a:'体の中（羽毛と皮ふの内側。いつも曲げた姿勢でいる）'},
  {q:'タコの心臓はいくつある？',h:'えら用の心臓もある。',a:'3つ'},
  {q:'イカやタコの血は何色？',h:'銅をふくむタンパク質で酸素を運ぶ。',a:'青（青っぽい）'},
  {q:'ペンギンが野生でくらしているのは、北半球？南半球？',h:'北極にはいない。',a:'主に南半球'},
  {q:'マラソンの距離は？',h:'42km より少し長い。',a:'42.195km'},
  {q:'虹のいちばん外側の色は？（ふつうの虹）',h:'波長の長い色。',a:'赤'},
  {q:'日本の信号の「青」は、実際には何色に近い？',h:'法令上の名前は「青色」。',a:'緑色（青みがかった緑）'},
  {q:'アメリカの「独立記念日」は何月何日？',h:'夏。花火が上がる。',a:'7月4日'},
  {q:'地球は1日に1回自転する。赤道上の地面が動く速さは、およそ時速何km？',h:'赤道1周は約4万km。',a:'約1700km'},
  {q:'紙を1回折ると2枚重ね、2回で4枚重ね。10回折ると何枚重ね？',h:'2の10乗。',a:'1024枚重ね'},
  {q:'あるウイルスが1分ごとに2倍に増え、1時間でびんがいっぱいになった。半分だったのは何分の時点？',h:'いっぱいになる1分前。',a:'59分'},
  {q:'100人の中に、少なくとも1人はうそつきがいる。どの2人を選んでも、少なくとも1人は正直者。うそつきは何人？',h:'うそつきが2人いたら、その2人を選ぶと…。',a:'1人'},
  {q:'3人のうち1人だけが本当のことを言っている。A「Bがうそつき」、B「Cがうそつき」、C「AとBはうそつき」。本当のことを言っているのは？',h:'1人ずつ「この人が正直」と仮定してみよう。',a:'B',e:'Bが正直ならCはうそつき。Aの「Bがうそつき」はうそで、Cの「AとBはうそつき」もうそ（Bは正直）。矛盾しない。'},
  {q:'2本の同じ長さのロウソク。1本は4時間、もう1本は5時間で燃えつきる。同時に火をつけると、一方の長さがもう一方の4倍になるのは何時間後？',h:'残りの長さを時間の式で表そう。',a:'3時間45分後',e:'残りはそれぞれ 1−t/4 と 1−t/5。1−t/5＝4(1−t/4) より t＝15/4。'},
  {q:'12枚のコインを、表のものが7枚になるように並べた。目かくしをして、表の枚数が同じ2つの山に分けるには？',h:'どちらかの山を全部裏返す。',a:'7枚を取り分けて、その7枚を全部裏返す',e:'7枚の山の表がk枚なら、残り5枚の山の表は7−k枚。7枚を裏返すと表は7−k枚になり、そろう。'},
  {q:'男が家を出て、左に3回曲がって家に戻ってくると、マスクをつけた男が2人待っていた。何をしていた？',h:'「家」を英語にすると…。',a:'野球（ホームで待っていたのはキャッチャーと審判）'},
  {q:'「すべての規則には例外がある」。この文自体が規則なら、どうなる？',h:'この文にも例外が…。',a:'例外のない規則があることになり、文が自分を否定してしまう（パラドックス）'},
  {q:'ある床屋の主人は「自分でひげをそらない人全員のひげをそり、自分でそる人のひげはそらない」。主人のひげはだれがそる？',h:'主人が自分でそるとすると…。',a:'決められない（床屋のパラドックス）'},
  {q:'電車が時速100kmで走っている。車内で進行方向に時速5kmで歩くと、地面から見た速さは？',h:'向きが同じなら…。',a:'時速105km'},
  {q:'エスカレーターの上で立ち止まると30秒、止まったエスカレーターを歩くと60秒。動くエスカレーターを歩くと？',h:'1秒に進む割合を足し算しよう。',a:'20秒',e:'1/30＋1/60＝1/20。'},
  {q:'1枚の紙を半分に42回折ると月まで届く。では、厚さを2倍にした紙なら、何回で届く？',h:'1回分得をする。',a:'41回'},
  {q:'円周率πを「3.14」と覚えるなら、「3.14159」の次の数字は？',h:'語呂合わせ「産医師異国に向こう（3.14159265）」。',a:'2（3.1415926…）'},
  {q:'1から9までの数字を1回ずつ使って作れる9けたの数のうち、いちばん小さいものは？',h:'大きい位に小さい数字を。',a:'123456789'},
  {q:'ひらがなをすべて1回ずつ使って作られた、「いろはにほへと」で始まる古い歌は？',h:'昔は、字の順番（あいうえお順の代わり）にも使われた。',a:'いろは歌'},
  {q:'10円玉10枚と、100円玉1枚。重いのはどっち？',h:'10円玉1枚は4.5g、100円玉1枚は4.8g。',a:'10円玉10枚（45g。100円玉1枚は4.8g）'},
  ]},
];

// ---------- storage ----------
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let settings=Object.assign({level:0,speak:true,autoSpeak:true,rate:0.9,shuffle:true},store.get('nz:settings',{}));
if(!LEVELS[settings.level])settings.level=0;
const saveSettings=()=>store.set('nz:settings',settings);
let P; // progress for the current level: {order, pos, known, unknown, step:'q'|'hint'|'ans'}
function newOrder(n,only){
  const idx=only?only.slice():[...Array(n).keys()];
  if(settings.shuffle)for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
  return idx;
}
function loadLevel(){
  const L=LEVELS[settings.level];
  P=store.get('nz:prog:'+L.key,null);
  if(!P||!Array.isArray(P.order)||P.order.some(i=>!L.list[i]))P={order:newOrder(L.list.length),pos:0,known:{},unknown:{},step:'q'};
  else if(!P.only){ // questions added later: mix the ones not yet in this round into the part still to come
    const have=new Set(P.order),add=newOrder(L.list.length).filter(i=>!have.has(i));
    if(add.length){const rest=P.order.slice(P.pos).concat(add);if(settings.shuffle)for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]]}P.order=P.order.slice(0,P.pos).concat(rest)}
  }
}
const save=()=>store.set('nz:prog:'+LEVELS[settings.level].key,P);

// ---------- よみあげ ----------
const canSpeak='speechSynthesis' in window;
let voice=null;
function pickVoice(){if(!canSpeak)return;const vs=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));voice=vs.find(v=>/Kyoko|O-ren|Otoya|Hattori|Google/i.test(v.name))||vs[0]||null}
if(canSpeak){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text){
  if(!canSpeak||!settings.speak)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[（(].*?[）)]/g,'').replace(/[？?]/g,'？'));u.lang='ja-JP';u.rate=settings.rate;if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){}
}

// ---------- 画面 ----------
const $=id=>document.getElementById(id);
function btn(label,cls,fn,dis){const b=document.createElement('button');b.type='button';if(cls)b.className=cls;b.innerHTML=label;b.onclick=fn;if(dis)b.disabled=true;return b}
function render(){
  const lv=$('levels');lv.innerHTML='';
  LEVELS.forEach((L,i)=>{const b=btn(`<span class="long">${L.name}</span><span class="short">${L.short}</span><small>${L.sub}</small>`,'',()=>{if(i===settings.level)return;save();settings.level=i;saveSettings();loadLevel();render()});b.setAttribute('aria-pressed',String(i===settings.level));lv.appendChild(b)});
  const L=LEVELS[settings.level],card=$('card');card.innerHTML='';
  const n=P.order.length,known=Object.keys(P.known).length,unknown=Object.keys(P.unknown).length;
  $('prog').style.width=(100*Math.min(P.pos,n)/n)+'%';
  if(P.pos>=n){ // おわり
    const d=document.createElement('div');d.className='done';
    d.innerHTML=`<div class="big">🎉</div><h2>ぜんぶ おわり！</h2><p>わかった ${known}もん ／ わからなかった ${unknown}もん</p>`;
    card.appendChild(d);
    const acts=document.createElement('div');acts.className='acts';
    acts.append(btn('もういちど はじめから','go',()=>{P={order:newOrder(L.list.length),pos:0,known:{},unknown:{},step:'q'};save();render();readQ()}));
    if(unknown)acts.append(btn(`わからなかった ${unknown}もんだけ`,'soft',()=>{const only=Object.keys(P.unknown).map(Number);P={order:newOrder(L.list.length,only),pos:0,known:{},unknown:{},step:'q',only:true};save();render();readQ()}));
    card.appendChild(acts);
    return;
  }
  const item=L.list[P.order[P.pos]];
  const meta=document.createElement('div');meta.className='meta';
  meta.innerHTML=`<span>だい <b>${P.pos+1}</b> もん ／ ${n}もん</span><span class="score"><span>⭕ <b>${known}</b></span><span>❌ <b>${unknown}</b></span></span>`;
  card.appendChild(meta);
  const q=document.createElement('p');q.className='q';q.textContent=item.q;card.appendChild(q);
  if(P.step==='hint'||P.step==='ans'){const h=document.createElement('div');h.className='box hint';h.innerHTML='<b>ヒント：</b>';h.append(item.h);card.appendChild(h)}
  if(P.step==='ans'){
    const a=document.createElement('div');a.className='box ans';
    const s=document.createElement('span');s.className='a';s.textContent=item.a;a.appendChild(s);
    if(item.e){const e=document.createElement('span');e.className='e';e.textContent=item.e;a.appendChild(e)}
    card.appendChild(a);
  }
  const acts=document.createElement('div');acts.className='acts';
  if(canSpeak&&settings.speak)acts.append(btn('🔊 よみあげる','soft',()=>{speak(P.step==='ans'?`こたえは、${item.a}。${item.e||''}`:item.q)}));
  if(P.step!=='ans'){
    acts.append(btn('💡 ヒント','soft',()=>{P.step='hint';save();render();speak('ヒント。'+item.h)},P.step==='hint'));
    acts.append(btn('こたえを 見る','go',()=>{P.step='ans';save();render();speak(`こたえは、${item.a}。${item.e||''}`)}));
  }else{
    acts.append(btn('⭕ わかった！','go',()=>next(true)),btn('❌ わからなかった','no',()=>next(false)));
  }
  card.appendChild(acts);
}
function next(ok){
  const i=P.order[P.pos];
  if(ok){P.known[i]=1;delete P.unknown[i]}else{P.unknown[i]=1;delete P.known[i]}
  P.pos++;P.step='q';save();render();readQ();
}
function readQ(){if(!settings.autoSpeak)return;const L=LEVELS[settings.level];if(P.pos<P.order.length)speak(L.list[P.order[P.pos]].q)}

// ---------- せってい ----------
$('gear').onclick=()=>{
  const sh=$('sheet');sh.innerHTML='';
  const head=document.createElement('div');head.className='head';head.innerHTML='<h2>せってい</h2>';head.appendChild(btn('とじる','close',()=>{$('modal').hidden=true}));sh.appendChild(head);
  const opt=(type,name,checked,label,note,fn)=>{const l=document.createElement('label');l.className='opt';l.innerHTML=`<input type="${type}" name="${name}" ${checked?'checked':''}><span>${label}${note?`<small>${note}</small>`:''}</span>`;l.querySelector('input').onchange=e=>fn(e.target.checked);return l};
  const h=t=>{const e=document.createElement('h3');e.textContent=t;sh.appendChild(e)};
  h('よみあげ');
  if(!canSpeak){const p=document.createElement('p');p.className='note';p.textContent='このブラウザでは よみあげが つかえません。';sh.appendChild(p)}
  sh.appendChild(opt('checkbox','sp',settings.speak,'よみあげボタンを 出す','iPadの こえで もんだいや こたえを よみあげます。字が よめない子も あそべます。',v=>{settings.speak=v;saveSettings();render()}));
  sh.appendChild(opt('checkbox','asp',settings.autoSpeak,'つぎの もんだいを じどうで よみあげる','「わかった」「わからなかった」を おすと、つぎの もんだいを すぐ よみあげます。',v=>{settings.autoSpeak=v;saveSettings()}));
  const row=document.createElement('div');row.className='row';
  [[0.7,'ゆっくり'],[0.9,'ふつう'],[1.1,'はやい']].forEach(([r,l])=>row.appendChild(opt('radio','rate',settings.rate===r,l,'',()=>{settings.rate=r;saveSettings();speak('こえの はやさは、これくらいです')})));
  sh.appendChild(row);
  h('もんだいの じゅんばん');
  sh.appendChild(opt('checkbox','sh',settings.shuffle,'ばらばらに だす','オフにすると、いつも おなじ じゅんばんで でます（つぎに「はじめから」に したときから）。',v=>{settings.shuffle=v;saveSettings()}));
  h('きろく');
  const p=document.createElement('p');p.className='note';p.textContent='いまの むずかしさの「わかった・わからなかった」を けして、さいしょから やりなおします。';sh.appendChild(p);
  sh.appendChild(btn('いまの むずかしさを はじめから','reset',()=>{const L=LEVELS[settings.level];P={order:newOrder(L.list.length),pos:0,known:{},unknown:{},step:'q'};save();$('modal').hidden=true;render()}));
  $('modal').hidden=false;
};
$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').hidden=true};

loadLevel();render();
})();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}))}
</script>
