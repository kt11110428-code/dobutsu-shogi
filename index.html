<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#23392d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="盤あそび">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>おうちの盤あそび</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#23392d;color:#fff6e3;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
h1{margin:0;font-size:clamp(26px,5vw,40px);font-weight:900;letter-spacing:.06em;text-align:center}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;width:min(760px,100%)}
a.game{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 20px 24px;border-radius:24px;
  background:#fff6e3;color:#4a3521;text-decoration:none;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .15s}
a.game:active{transform:scale(.97)}
a.game:focus-visible{outline:4px solid #ffe36e;outline-offset:3px}
a.game img{width:128px;height:128px;border-radius:28px}
a.game b{font-size:26px;font-weight:900}
a.game span{font-size:14px;font-weight:700;color:#7a5a3a;text-align:center;line-height:1.5}
a.game i{font-style:normal;margin-top:4px;background:#3f9a5b;color:#fff;font-weight:900;font-size:17px;padding:10px 26px;border-radius:999px}
</style>
</head>
<body>
<main>
  <h1>なにで あそぶ？</h1>
  <div class="games">
    <a class="game" href="shogi/"><img src="icon-192.png" alt=""><b>どうぶつしょうぎ</b><span>どこでも・ごろごろ・おおきな森<br>つめしょうぎ・おけいこ</span><i>あそぶ ▶</i></a>
    <a class="game" href="reversi/"><img src="reversi-icon.png" alt=""><b>リバーシ</b><span>みんなで（2〜4にん）・コンピュータ<br>もんだい・おけいこ</span><i>あそぶ ▶</i></a>
  </div>
</main>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
